<div class="container">
  <h1>Minhas tarefas</h1>

  <div class="input-container">
    <input
      type="text"
      placeholder="Digite uma nova tarefa..."
      [(ngModel)]="novaTarefaTexto"
      (keyup.enter)="adicionarTarefa()"
    />
    <button (click)="adicionarTarefa()">Adicionar</button>
  </div>

  <ul class="lista-tarefas">
    @for (tarefa of tarefas; track $index) {
      <li class="task" [class.completed]="tarefa.concluida">
        <label>
          <input type="checkbox" [(ngModel)]="tarefa.concluida" />
          <span>{{ tarefa.descricao }}</span>
        </label>
        <button class="btn-remover" (click)="removerTarefa($index)">Remover</button>
      </li>
    } @empty {
      <li class="mensagem-vazia">Nenhuma tarefa encontrada.</li>
    }
  </ul>

  <div class="contador">
    <p>Tarefas concluídas: <strong>{{ totalConcluidas() }}</strong></p>
  </div>
</div>
